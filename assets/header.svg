
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Mostafa Shazly - Machine Learning and Agentic AI Engineer in Progress" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060d18"/>
      <stop offset="55%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 64px 'JetBrains Mono', 'Courier New', monospace; fill: url(#title); }
      .sub   { font: 500 20px 'JetBrains Mono', 'Courier New', monospace; fill: #8b949e; }
      .line  { font: 700 22px 'JetBrains Mono', 'Courier New', monospace; fill: #58a6ff; opacity: 0; animation: cycle 18s infinite; }
      .l1 { animation-delay: 0s; } .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; }
      .l4 { animation-delay: 9s; } .l5 { animation-delay: 12s; } .l6 { animation-delay: 15s; }
      @keyframes cycle { 0% {opacity:0; transform: translateY(8px);} 2.5% {opacity:1; transform: translateY(0);} 14% {opacity:1;} 16.67% {opacity:0;} 100% {opacity:0;} }
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; } .n4 { animation-delay: 2.2s; }
      @keyframes pulse { 0%,100% {opacity:.25;} 50% {opacity:.9;} }
      .cursor { animation: blink 1s steps(1) infinite; fill: #58a6ff; }
      @keyframes blink { 50% {opacity:0;} }
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <!-- neural-network decoration -->
  <g stroke="#58a6ff" stroke-opacity="0.18" stroke-width="1.2">
    <line x1="760" y1="60" x2="850" y2="40"/><line x1="760" y1="60" x2="850" y2="120"/>
    <line x1="760" y1="140" x2="850" y2="40"/><line x1="760" y1="140" x2="850" y2="120"/><line x1="760" y1="140" x2="850" y2="200"/>
    <line x1="760" y1="220" x2="850" y2="120"/><line x1="760" y1="220" x2="850" y2="200"/>
    <line x1="850" y1="40" x2="940" y2="90"/><line x1="850" y1="120" x2="940" y2="90"/><line x1="850" y1="120" x2="940" y2="170"/><line x1="850" y1="200" x2="940" y2="170"/>
  </g>
  <g fill="#58a6ff">
    <circle class="node" cx="760" cy="60" r="7"/><circle class="node n2" cx="760" cy="140" r="7"/><circle class="node n3" cx="760" cy="220" r="7"/>
    <circle class="node n2" cx="850" cy="40" r="7"/><circle class="node" cx="850" cy="120" r="7"/><circle class="node n4" cx="850" cy="200" r="7"/>
    <circle class="node n3" cx="940" cy="90" r="7"/><circle class="node n4" cx="940" cy="170" r="7"/>
  </g>

  <text class="title" x="50" y="115">Mostafa Shazly</text>
  <text class="sub" x="52" y="155">Machine Learning &amp; Agentic AI Engineer in Progress</text>

  <g transform="translate(52,215)">
    <text class="line l1">&gt; Building intelligent systems</text>
    <text class="line l2">&gt; Machine Learning | Deep Learning | Data Science</text>
    <text class="line l3">&gt; 590K+ rows processed</text>
    <text class="line l4">&gt; 2M+ records cleaned</text>
    <text class="line l5">&gt; 98.5% R2 on Crop Yield</text>
    <text class="line l6">&gt; 91.7% CNN Accuracy</text>
  </g>
</svg>
